name: Flask App CI

on:
  push:
    branches: [ master, main ]
  pull-request:
    branches: [ master, main ]

jobs:
  bouild-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Chekout repasitory
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Intioalize database
        run: |
          python -c "import sqlite3; conn = sqlite3.connect('todo.db'); conn.close()" || true
          if [ -f init_db.py]; then python init.py; fi

      - name: Smoke test Flask server
        run: |
          export FLASK_APP=app.py
          python -m flask tun --host=127.0.0.1 --port=5000 &
          sleep 5
          curl -i http://127.0.0.1:5000/

